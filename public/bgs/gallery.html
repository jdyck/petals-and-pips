<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pips & Petals · 30 diagonal watercolor backgrounds</title>
<style>
:root{color-scheme:light;--ink:#293a50;--muted:#718071;--line:#dce1da;--paper:#fbfaf7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}header{padding:54px 5vw 30px;border-bottom:1px solid var(--line)}.brand{font-size:12px;letter-spacing:5px;margin:0 0 24px}h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,64px);font-weight:400;margin:0 0 14px}header p:last-child{font-size:15px;color:#68736f;line-height:1.6;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px;padding:32px 5vw 64px}.card{margin:0}.card button{cursor:zoom-in;display:block;width:100%;padding:0;border:1px solid #e2e3de;background:#f2f1eb;aspect-ratio:1.85;overflow:hidden;transition:box-shadow .2s,transform .2s}.card button:hover{transform:translateY(-3px);box-shadow:0 10px 25px #273c4c14}.card img{display:block;width:100%;height:100%;object-fit:contain}.card figcaption{padding:14px 0;display:flex;align-items:baseline;gap:12px}.number{font-size:12px;letter-spacing:2px;color:#8b948e}.name{font-family:Georgia,serif;font-size:21px}button:focus-visible,a:focus-visible{outline:3px solid #7f91a3;outline-offset:5px}dialog{width:min(1400px,94vw);max-height:94vh;padding:0;border:1px solid var(--line);background:var(--paper);color:var(--ink)}dialog::backdrop{background:#1c2c3bce;backdrop-filter:blur(5px)}.bar{display:flex;gap:16px;align-items:center;padding:18px 24px}.bar h2{flex:1;font:400 24px Georgia,serif;margin:0}.bar button,.bar a{padding:10px 14px;background:transparent;border:1px solid #bdc7c2;color:var(--ink);font:13px Arial,sans-serif;text-decoration:none;cursor:pointer}.large{display:block;width:100%;max-height:70vh;object-fit:contain;background:white}.bottom{justify-content:space-between;font-size:13px;color:#68736f}.bottom span{text-align:center}.empty{opacity:.55}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header{padding-top:32px}.grid{grid-template-columns:1fr;gap:12px}.bar{padding:14px;gap:8px}.bar h2{font-size:20px}.bar button,.bar a{padding:9px}.brand{letter-spacing:3px}}
.card button{position:relative}.reading{display:none;position:absolute;inset:0;pointer-events:none;color:#26384f;font-family:Arial,sans-serif}.show-text .reading{display:block}.reading span{position:absolute;white-space:nowrap}.reading .tl{left:5%;top:8%;font-size:clamp(8px,.75vw,12px);letter-spacing:2px}.reading .mid{left:50%;top:50%;transform:translate(-50%,-50%);font:400 clamp(14px,1.6vw,26px) Georgia,serif}.reading .br{right:7%;bottom:11%;font-size:clamp(8px,.75vw,12px);letter-spacing:2px}.reading-toggle{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:14px;cursor:pointer;width:max-content}.reading-toggle input{accent-color:#546e65;width:17px;height:17px}.full-preview{position:relative;width:100%;max-width:calc(70vh * 1.85);margin:0 auto}.full-preview .reading .tl,.full-preview .reading .br{font-size:clamp(10px,1.2vw,19px)}.full-preview .reading .mid{font-size:clamp(20px,3vw,44px)}
</style></head>
<body>
<header><p class="brand">PIPS &amp; PETALS</p><h1>Flowers in balance.</h1><p>30 diagonal watercolor backgrounds · Select any study to see it larger.<br>Flowers at lower left and upper right. A soft wash and clear space for play.</p><label class="reading-toggle"><input id="reading-toggle" type="checkbox">Preview text placement</label></header>
<main class="grid" id="gallery" aria-label="30 watercolor background options"></main>
<dialog id="viewer" aria-labelledby="title"><div class="bar"><h2 id="title"></h2><a id="download" download>Save image</a><button id="close" aria-label="Close preview">Close ×</button></div><div class="full-preview"><img class="large" id="large" alt=""><div class="reading" aria-hidden="true"><span class="tl">ROUND 8 OF 13</span><span class="mid">Room to play</span><span class="br">1 ROLL LEFT</span></div></div><div class="bar bottom"><button id="prev" aria-label="Previous background">← Previous</button><span id="position"></span><button id="next" aria-label="Next background">Next →</button></div></dialog>
<script>
const names=["Pink wild rose", "Blue brush blooms", "White frangipani", "Single blush cosmos", "Blue poppy", "Coral rose", "White garden bloom", "Lilac bells", "Peach poppies", "Buttercup", "Pink apple blossom", "Dusty mauve", "Sky blue cups", "Cream camellia", "Soft red poppy", "Violet wildflower", "Blush pair", "Forget-me-not sprig", "Lemon cosmos", "Lavender poppy", "Coral blossom branch", "Blue and white", "Pink sweet pea", "White and sage", "Turquoise meadow", "Apricot single", "Plum and blush", "Pale peach rose", "Tiny spring flowers", "Yellow frangipani mist"];
const items=names.map((name,i)=>({name,number:String(i+1).padStart(2,'0'),file:String(i+1).padStart(2,'0')+'-'+name.toLowerCase().replaceAll(' ','-')+'.png'}));
const gallery=document.querySelector('#gallery'),viewer=document.querySelector('#viewer');let current=0;
for(const [i,item] of items.entries()){const fig=document.createElement('figure');fig.className='card';const button=document.createElement('button');button.setAttribute('aria-label',`Preview ${item.number}: ${item.name}`);const img=document.createElement('img');img.src=item.file;img.alt=`${item.name} watercolor floral background`;img.loading=i<6?'eager':'lazy';img.addEventListener('error',()=>{img.style.visibility='hidden';button.classList.add('empty')});img.addEventListener('load',()=>{img.style.visibility='visible';button.classList.remove('empty')});button.append(img);const overlay=document.createElement('div');overlay.className='reading';overlay.setAttribute('aria-hidden','true');overlay.innerHTML='<span class="tl">ROUND 8 OF 13</span><span class="mid">Room to play</span><span class="br">1 ROLL LEFT</span>';button.append(overlay);button.onclick=()=>show(i);const caption=document.createElement('figcaption');caption.innerHTML=`<span class="number">${item.number}</span><span class="name">${item.name}</span>`;fig.append(button,caption);gallery.append(fig)}
document.querySelector('#reading-toggle').addEventListener('change',e=>document.body.classList.toggle('show-text',e.target.checked));
function show(i){current=(i+items.length)%items.length;const item=items[current];document.querySelector('#title').textContent=`${item.number} · ${item.name}`;const img=document.querySelector('#large');img.src=item.file;img.alt=`${item.name} watercolor floral background`;document.querySelector('#download').href=item.file;document.querySelector('#position').textContent=`${current+1} of 30 · Use arrow keys to browse`;if(!viewer.open)viewer.showModal()}
document.querySelector('#close').onclick=()=>viewer.close();document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});viewer.addEventListener('click',e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close()}});
</script></body></html>
